<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 170" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070a10" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.8">
        <animate attributeName="stop-color" values="#00F0FF;#7928CA;#00F0FF" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#7928CA" stop-opacity="0.9">
        <animate attributeName="stop-color" values="#7928CA;#00F0FF;#7928CA" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0.8">
        <animate attributeName="stop-color" values="#00F0FF;#7928CA;#00F0FF" dur="6s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#00F0FF" />
    </linearGradient>

    <!-- Radial Glow Behind Title -->
    <radialGradient id="radialGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#7928CA" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0a0e17" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Card Background with Border -->
  <rect x="2" y="2" width="846" height="166" rx="14" fill="url(#bgGradient)" stroke="url(#borderGradient)" stroke-width="1.5" />

  <!-- Animated Glowing Aura -->
  <circle cx="425" cy="85" r="160" fill="url(#radialGlow)">
    <animate attributeName="r" values="140;180;140" dur="5s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.6;1;0.6" dur="5s" repeatCount="indefinite" />
  </circle>

  <!-- Decorative Corner Tech Marks -->
  <g stroke="#334155" stroke-width="1" opacity="0.6">
    <!-- Top Left -->
    <line x1="20" y1="20" x2="35" y2="20" />
    <line x1="20" y1="20" x2="20" y2="35" />
    <!-- Top Right -->
    <line x1="830" y1="20" x2="815" y2="20" />
    <line x1="830" y1="20" x2="830" y2="35" />
    <!-- Bottom Left -->
    <line x1="20" y1="150" x2="35" y2="150" />
    <line x1="20" y1="150" x2="20" y2="135" />
    <!-- Bottom Right -->
    <line x1="830" y1="150" x2="815" y2="150" />
    <line x1="830" y1="150" x2="830" y2="135" />
  </g>

  <!-- Main Title -->
  <text x="425" y="66" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" letter-spacing="3.5" fill="url(#titleGradient)">
    SEBASTIAN GOMEZ
  </text>

  <!-- Subtitle -->
  <text x="425" y="100" text-anchor="middle" font-family="'Fira Code', 'JetBrains Mono', Consolas, monospace" font-size="14.5" font-weight="600" letter-spacing="1.2" fill="#38BDF8">
    FULL-STACK DEVELOPER • BUSINESS AUTOMATION • AI &amp; BI PLATFORMS
  </text>

  <!-- Status Badge with Pulsing Green/Cyan Light -->
  <g transform="translate(325, 122)">
    <rect width="200" height="26" rx="13" fill="#030712" stroke="#1e293b" stroke-width="1" />
    <!-- Pulsing outer ring -->
    <circle cx="20" cy="13" r="6" fill="none" stroke="#00F0FF" stroke-width="1" opacity="0.7">
      <animate attributeName="r" values="3.5;7.5;3.5" dur="2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.8;0;0.8" dur="2s" repeatCount="indefinite" />
    </circle>
    <!-- Solid inner dot -->
    <circle cx="20" cy="13" r="3.5" fill="#00F0FF">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <!-- Badge text -->
    <text x="34" y="17.2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#94A3B8" letter-spacing="0.8">
      AVAILABLE FOR PROJECTS
    </text>
  </g>
</svg>
